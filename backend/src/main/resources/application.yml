spring:
  application:
    name: disk-share

  # DataSource - MySQL (production)
  # Uncomment below and comment H2 config for production
  # datasource:
  #   url: jdbc:mysql://localhost:3306/disk_share?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
  #   username: root
  #   password: ${DB_PASSWORD:root}
  #   driver-class-name: com.mysql.cj.jdbc.Driver

  # DataSource - H2 (development)
  datasource:
    url: jdbc:h2:file:./data/disk_share;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# CORS
app:
  cors:
    allowed-origins: http://localhost:5173

# Logging
logging:
  level:
    com.disk.share: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
