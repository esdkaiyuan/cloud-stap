spring:
  application:
    name: disk-share

  datasource:
    url: jdbc:h2:file:${DATA_DIR:./data}/disk_share;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# CORS - comma-separated origins
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://esdkaiyuan.github.io}

# Logging
logging:
  level:
    com.disk.share: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
